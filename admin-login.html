<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#216c4a">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Administration — CalasOrga</title>
<style>:root{--bg:#f5f7f6;--card:#fff;--text:#17251e;--muted:#64726b;--line:#dfe5e1;--accent:#216c4a;--danger:#b42318;--danger-bg:#fff0ee;--focus:#155eef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:680px;margin:0 auto;padding:50px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h1{margin:0 0 14px;font-size:28px}.muted{color:var(--muted)}.small{font-size:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:750}.input-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}.field input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--text);font-size:16px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 45%,transparent);outline-offset:2px}.actions{display:flex;gap:9px;margin-top:14px}.notice{border-radius:12px;padding:11px 13px;margin-top:14px;border:1px solid #efb2aa;background:var(--danger-bg);color:var(--danger)}.hidden{display:none!important}@media(max-width:620px){.shell{padding-top:24px}.card h1{font-size:25px}}</style>
</head>
<body>
<main class="shell">
<section class="card">
<h1>Administration</h1>
<p class="muted">Entrez votre code administrateur.</p>
<form id="loginForm" autocomplete="on">
<div class="field">
<label for="adminCode">Code administrateur</label>
<div class="input-row">
<input id="adminCode" type="password" autocomplete="current-password" minlength="6" maxlength="6" placeholder="6 caractères">
<button class="btn" type="button" id="toggleCode" aria-label="Afficher le code administrateur" aria-pressed="false" title="Afficher le code">👁️</button>
</div>
</div>
<div class="actions"><button class="btn primary" type="submit" id="submitBtn">Entrer</button></div>
<div class="notice hidden" id="error" role="alert"></div>
<p class="muted small">Le code est vérifié par le serveur et n’apparaît pas dans l’adresse.</p>
</form>
</section>
</main>
<script>(()=>{'use strict';const q=s=>document.querySelector(s),form=q('#loginForm'),input=q('#adminCode'),toggle=q('#toggleCode'),btn=q('#submitBtn'),err=q('#error');function showError(t=''){err.textContent=t;err.classList.toggle('hidden',!t)}async function login(payload){btn.disabled=true;showError();try{const r=await fetch('/api/session/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Connexion impossible.');location.replace('/admin')}catch(e){showError(e.message);btn.disabled=false;input.focus();input.select()}}toggle.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.setAttribute('aria-pressed',show?'true':'false');toggle.setAttribute('aria-label',show?'Masquer le code administrateur':'Afficher le code administrateur');toggle.title=show?'Masquer le code':'Afficher le code';input.focus()});form.addEventListener('submit',e=>{e.preventDefault();const code=input.value.trim();if(Array.from(code).length!==6){showError('Le code doit contenir exactement 6 caractères.');return}login({code})});const recovery=decodeURIComponent(location.hash.slice(1));if(recovery){history.replaceState(null,'',location.pathname);form.classList.add('hidden');login({token:recovery})}else input.focus()})();</script>
</body>
</html>
